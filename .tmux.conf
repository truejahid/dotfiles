# Status bar position
set -g status-position top

# Status bar appearance
set -g status-style 'bg=#000000,fg=#777777,nounderscore'

# Window list alignment
set -g status-justify left

# Window numbering
set -g base-index 1

# Automatically renumber windows
set -g renumber-windows on

# Window list spacing
set -g window-status-separator ''

# Inactive windows: gray text
set -g window-status-format '#[fg=#777777,nounderscore] #I:#W #[default]'

# Active window: white background, black text
set -g window-status-current-format '#[fg=#000000,bg=#ffffff,nounderscore] #I:#W #[default]'

# Right status segment
set -g status-right-length 60
set -g status-right '#{?pane_in_mode,#[fg=#ffffff]COPY ,}#{?client_prefix,#[fg=#ffffff]PREFIX ,}#{?window_zoomed_flag,#[fg=#ffffff]ZOOM ,}#[fg=#777777]#S '

# Message appearance
set -g message-style 'fg=#ffffff,bg=#000000,fill=#000000'

# Copy mode appearance
set -g mode-style 'fg=#000000,bg=#ffffff'

# Command prompt appearance
set -g message-command-style 'fg=#ffffff,bg=#000000,fill=#000000'

# Pane indicator appearance
set -g display-panes-colour '#777777'
set -g display-panes-active-colour '#ffffff'

# Pane border characters
set -g pane-border-lines single

# Disable left status segment
set -g status-left ''
set -g status-left-length 0

# Status bar refresh interval
set -g status-interval 1

# Pane border appearance
set -g pane-border-style 'fg=#333333'
set -g pane-active-border-style 'fg=#333333'
set -g pane-border-indicators off
