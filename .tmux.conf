set-option -g status-style "bg=black,fg=white"
set-option -g window-status-current-style "fg=white,bg=black,nounderscore"
set-option -g status-right ""

# Start window numbering at 1
set-option -g base-index 1

# Automatically close numbering gaps
# set-option -g renumber-windows on

# For window rename and error
set -g message-style 'fg=red,bg=black,fill=black'
