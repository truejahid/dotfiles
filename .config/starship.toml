add_newline = false

format = "$character $directory$git_branch"

[character]
format = "$symbol"
success_symbol = "[->](white)"
error_symbol = "[->](red)"

[directory]
style = "white"
format = "[$path]($style) "
truncation_length = 1
truncate_to_repo = false

[git_branch]
symbol = " "
style = "#777777"
format = "[on $symbol$branch]($style) "
