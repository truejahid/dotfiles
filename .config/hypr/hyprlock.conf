
animations {
    enabled = false
}

# GENERAL
general {
    hide_cursor = true
}

# BACKGROUND
background {
    monitor =
    color = rgb(0, 0, 0)
}

# PASSWORD INPUT
input-field {
    monitor =

    size = 60%, 14%
    outline_thickness = 0

    dots_size = 0.8
    dots_spacing = 0.2
    dots_center = true
    dots_text_format = *

    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0)
    font_color = rgb(255, 255, 255)

    font_family = monospace

    fade_on_empty = false
    placeholder_text =
    fail_text =

    position = 0, 0
    halign = center
    valign = center

    check_color = rgba(0, 0, 0, 0)
    fail_color = rgba(0, 0, 0, 0)
}
